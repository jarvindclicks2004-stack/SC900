<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>SC-900 Path 1 Quiz</title>
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <nav class="nav-bar">
    <div class="container">
      <a href="../index.html" class="site-title">SC-900 Study Hub</a>
      <div class="nav-links">
        <a href="path1.html" class="active">Quiz</a>
        <a href="../flashcards/path1.html">Flashcards</a>
      </div>
    </div>
  </nav>

  <main class="container">
    <div class="quiz-header">
      <h1>Path 1 Practice Quiz</h1>
      <p class="text-muted">Security, compliance, and identity concepts &middot; 25 questions</p>

      <div class="progress-bar-container">
        <div class="progress-bar">
          <div class="progress-fill" id="progress-fill"></div>
        </div>
        <span class="progress-text" id="progress-text">0 of 25 answered</span>
      </div>
    </div>

    <div id="quiz-container"></div>

    <div class="quiz-controls">
      <button type="button" class="btn btn-primary" id="btn-submit">Submit Quiz</button>
      <button type="button" class="btn btn-secondary" id="btn-restart">Restart</button>
    </div>

    <div class="quiz-results hidden" id="quiz-results">
      <h2>Results</h2>
      <p class="score-display" id="score-display"></p>
      <p class="score-summary" id="score-summary"></p>
    </div>
  </main>

  <footer class="footer">
    <div class="container">
      <p class="text-muted">SC-900 Path 1 Study Hub</p>
    </div>
  </footer>

  <script src="../js/quiz.js"></script>
</body>
</html>
